<!DOCTYPE html>

<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black">

<title>Patient Check-In</title>

<style>

html, body {

    margin: 0;

    width: 100%;

    height: 100%;

    overflow: hidden;

    font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;

    background: #1677ff;

}

#button {

    width: 100vw;

    height: 100vh;

    border: 0;

    background: #1677ff;

    color: white;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    cursor: pointer;

}

.bell {

    font-size: 120px;

}

.title {

    font-size: 65px;

    font-weight: bold;

    margin-top: 20px;

}

.tap {

    font-size: 90px;

    font-weight: 900;

    margin-top: 45px;

}

.instructions {

    font-size: 30px;

    margin-top: 35px;

}

</style>

</head>

<body>

<button id="button" onclick="checkIn()">

<div class="bell">🔔</div>

<div class="title">

PATIENT CHECK-IN

</div>

<div class="tap">

TAP HERE

</div>

<div class="instructions">

Tap to let Dr. Gillaspie know you are here

</div>

</button>

<script>

function checkIn() {

    window.location.href =

    "shortcuts://run-shortcut?name=Dr.%20Gillaspie";

}

</script>

</body>

</html>
